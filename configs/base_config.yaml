# Base configuration for Valerie Visual ASR
# This file contains default settings that can be overridden by dataset-specific configs

model:
  # Input specifications
  input_height: 224
  input_width: 224
  input_channels: 3
  max_sequence_length: 500
  
  # 3D CNN parameters
  embed_dim: 512
  conv3d_channels: [64, 128, 256, 512]
  conv3d_kernel_size: 3
  conv3d_stride: 1
  conv3d_padding: 1
  
  # Conformer parameters
  conformer_layers: 12
  conformer_heads: 8
  conformer_dim: 512
  conv_kernel_size: 31
  ffn_expansion_factor: 4
  dropout: 0.1
  
  # Phoneme vocabulary
  phoneme_vocab_size: 40  # 39 phonemes + blank
  
  # CTC/Attention parameters
  decoder_dim: 256
  attention_heads: 8
  
  # LLM configuration - Upgraded to match VALLR scale
  llm_model_name: "Qwen/Qwen3-1.7B"
  lora_rank: 16
  lora_alpha: 32
  enable_thinking: false  # Qwen3 thinking mode
  max_new_tokens: 32768  # Qwen3 recommended output length

training:
  # Loss weights
  ctc_weight: 0.3
  attention_weight: 0.7
  distillation_weight: 0.1
  temporal_consistency_weight: 0.05
  
  # Optimization parameters
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  warmup_steps: 4000
  max_epochs: 100
  batch_size: 8
  gradient_clip_val: 1.0
  
  # Training strategy
  mixed_precision: true
  gradient_checkpointing: true
  accumulate_grad_batches: 1
  
  # Scheduler parameters
  scheduler_type: "cosine"  # cosine, linear, exponential
  min_lr: 1.0e-6
  
  # Validation
  val_check_interval: 0.25
  patience: 10

data:
  # Dataset paths (to be overridden by specific configs)
  voxceleb2_root: "/data/voxceleb2"
  avspeech_root: "/data/avspeech"
  
  # Two-stage training data paths (for generated transcriptions and phonemes)
  transcription_dir: "data/transcriptions"
  phoneme_dir: "data/phonemes"
  
  # Training methodology
  use_two_stage_training: true  # Use two-stage visual speech recognition training
  training_stage: "stage1"  # "stage1" (video→phonemes), "stage2" (phonemes→text), "both"
  
  # Preprocessing parameters
  frame_rate: 25
  audio_sample_rate: 16000
  
  # Data loading
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  max_samples: null  # Limit dataset size for testing (null = no limit)
  quality_filter: true
  
  # Augmentation parameters
  horizontal_flip_prob: 0.5
  brightness_range: 0.2
  contrast_range: 0.2
  noise_std: 0.01
  mixup_alpha: 0.2
  
  # Quality filtering
  min_face_confidence: 0.8
  min_transcription_confidence: 0.1  # Lower threshold for Whisper ASR
  min_duration: 1.0
  max_duration: 10.0
  max_sequence_length: 500

distillation:
  # Teacher model - Using Whisper Large V3 for best performance
  teacher_model_name: "openai/whisper-large-v3"
  teacher_feature_dim: 1280  # Whisper Large V3 feature dimension
  
  # Distillation parameters
  temperature: 4.0
  feature_matching_weight: 1.0  # Weight for feature matching loss
  contrastive_weight: 0.1  # Weight for contrastive loss
  alpha: 0.7  # Overall distillation weight
  
  # Cross-modal alignment
  use_cca_init: true
  projection_dim: 512