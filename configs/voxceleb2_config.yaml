# VoxCeleb2 specific configuration
# Inherits from base_config.yaml with VoxCeleb2-specific overrides

# Import base configuration
defaults:
  - base_config

# Dataset-specific overrides
data:
  # VoxCeleb2 dataset path (relative to project root)
  voxceleb2_root: "data"
  avspeech_root: ""  # Only use VoxCeleb2
  
  # VoxCeleb2 specific parameters
  dataset_name: "voxceleb2"
  use_automatic_transcription: true
  transcription_model: "openai/whisper-large-v2"
  
  # Larger batch size for VoxCeleb2 (shorter sequences on average)
  batch_size: 12
  
  # VoxCeleb2 specific augmentations
  speed_perturbation: true
  speed_range: [0.9, 1.1]
  
  # Quality filtering for automatic transcriptions
  min_transcription_confidence: 0.8
  filter_non_english: true
  
  # Speaker sampling strategy
  max_speakers_per_batch: 4
  speaker_balanced_sampling: true

training:
  # Adjusted for VoxCeleb2 characteristics
  max_epochs: 80  # Fewer epochs due to larger dataset
  val_check_interval: 0.1  # More frequent validation
  
  # Learning rate schedule adjusted for large dataset
  warmup_steps: 8000
  learning_rate: 2.0e-4  # Slightly higher LR
  
  # Regularization for large dataset
  dropout: 0.15
  weight_decay: 1.0e-5

model:
  # Slightly larger model for diverse VoxCeleb2 data
  conformer_layers: 14
  embed_dim: 576
  
  # Adjusted for speaker diversity
  speaker_embedding_dim: 128
  use_speaker_adaptation: true

# VoxCeleb2 specific evaluation
evaluation:
  # Test on VoxCeleb2 test set
  test_split: "test"
  
  # Metrics specific to VoxCeleb2
  compute_speaker_metrics: true
  speaker_verification_threshold: 0.5
  
  # Cross-dataset evaluation
  evaluate_on_lrs3: false  # Set to true if LRS3 is available for comparison