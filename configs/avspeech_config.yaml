# AVSpeech specific configuration
# Inherits from base_config.yaml with AVSpeech-specific overrides

# Import base configuration
defaults:
  - base_config

# Dataset-specific overrides
data:
  # AVSpeech dataset path
  voxceleb2_root: ""  # Only use AVSpeech
  avspeech_root: "/data/avspeech"
  
  # AVSpeech specific parameters
  dataset_name: "avspeech"
  use_face_coordinates: true  # Use provided face coordinates
  coordinate_refinement: true  # Refine provided coordinates
  
  # AVSpeech has cleaner segments, can use larger batch size
  batch_size: 16
  
  # Audio-visual synchronization parameters
  sync_verification: true
  max_sync_offset: 0.1  # 100ms maximum offset
  
  # Quality filtering
  min_face_confidence: 0.9  # Higher threshold for cleaner data
  min_audio_quality: 0.8
  filter_multi_speaker: true
  
  # Segment length filtering
  min_segment_length: 1.0  # Minimum 1 second
  max_segment_length: 10.0  # Maximum 10 seconds

training:
  # Adjusted for AVSpeech characteristics
  max_epochs: 120  # More epochs for smaller, cleaner dataset
  val_check_interval: 0.2
  
  # Conservative learning rate for clean data
  learning_rate: 1.0e-4
  warmup_steps: 3000
  
  # Less regularization needed for clean data
  dropout: 0.08
  weight_decay: 5.0e-7
  
  # Stronger distillation weight for clean audio-visual pairs
  distillation_weight: 0.15

model:
  # Standard model size for AVSpeech
  conformer_layers: 12
  embed_dim: 512
  
  # Enhanced audio-visual alignment for clean pairs
  cross_modal_attention: true
  alignment_loss_weight: 0.05

distillation:
  # Enhanced distillation for AVSpeech clean audio
  temperature: 3.0  # Lower temperature for cleaner alignment
  feature_matching: true
  
  # Use stronger audio teacher for clean data
  teacher_model_name: "facebook/wav2vec2-large-960h-lv60-self"
  
  # Multi-level distillation
  distill_intermediate_layers: true
  intermediate_layer_indices: [3, 6, 9]

# AVSpeech specific evaluation
evaluation:
  # Test on AVSpeech test set
  test_split: "test"
  
  # Audio-visual synchronization metrics
  compute_sync_metrics: true
  sync_tolerance: 0.05  # 50ms tolerance
  
  # Clean data specific metrics
  compute_phoneme_alignment: true
  alignment_accuracy_threshold: 0.1
  
  # Cross-dataset evaluation
  evaluate_on_voxceleb2: false  # Set to true for cross-dataset validation