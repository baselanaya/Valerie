# Multi-GPU Training Configuration for Valerie Visual ASR
# Optimized for single machine with 2-8 GPUs

# Training method selection
training_method: "ddp"  # ddp, accelerate

# GPU Configuration
gpu:
  # GPU IDs to use (null = all available)
  gpu_ids: null  # [0, 1, 2, 3] or null for all
  
  # Mixed precision training
  mixed_precision: "fp16"  # fp16, bf16, fp32
  
  # Memory optimization
  gradient_checkpointing: false  # Trade compute for memory
  max_memory_per_gpu: 0.9  # Use 90% of GPU memory

# Training Configuration
training:
  # Batch size per GPU (total = batch_size * num_gpus)
  batch_size: 8
  
  # Learning rate (will be scaled by number of GPUs)
  learning_rate: 1e-4
  base_lr_scale: true  # Scale LR by number of GPUs
  
  # Training schedule
  max_epochs: 50
  warmup_steps: 4000
  warmup_ratio: 0.1  # Alternative to warmup_steps
  
  # Optimization
  optimizer: "adamw"
  weight_decay: 1e-6
  beta1: 0.9
  beta2: 0.98
  eps: 1e-9
  
  # Gradient settings
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  
  # Learning rate scheduling
  scheduler: "cosine"  # cosine, linear, polynomial, constant
  min_lr: 1e-7
  lr_decay_factor: 0.1
  lr_patience: 5  # For plateau scheduler

# Data Loading Configuration
data:
  # Dataset paths
  voxceleb2_root: "data"
  avspeech_root: ""  # Leave empty if not using AVSpeech
  
  # Data loading optimization
  num_workers: 4  # Per GPU
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true  # For training stability
  
  # Data augmentation
  use_augmentation: true
  augmentation_prob: 0.8
  
  # Preprocessing
  video_size: [224, 224]
  sequence_length: 150
  audio_sample_rate: 16000

# Model Configuration
model:
  # Use base model config
  config_path: "configs/base_config.yaml"
  
  # Model optimization
  compile_model: true  # PyTorch 2.0 compilation
  compile_mode: "default"  # default, reduce-overhead, max-autotune
  
  # Gradient checkpointing for memory efficiency
  use_gradient_checkpointing: false

# Loss Configuration
loss:
  # Loss weights
  ctc_weight: 0.3
  attention_weight: 0.7
  distillation_weight: 0.1
  temporal_consistency_weight: 0.05
  
  # Loss scaling
  loss_scale: 1.0
  dynamic_loss_scaling: true

# DDP Specific Settings (when using PyTorch native DDP)
ddp:
  # Communication backend
  backend: "nccl"  # nccl (GPU), gloo (CPU)
  
  # DDP optimization
  find_unused_parameters: false
  bucket_cap_mb: 25
  gradient_as_bucket_view: true
  static_graph: false
  
  # Process group settings
  master_port: "12355"
  timeout_minutes: 30

# Accelerate Specific Settings (when using Accelerate)
accelerate:
  # Logging integration
  log_with: null  # tensorboard, wandb, all, or null
  
  # Project settings
  project_name: "valerie-visual-asr"
  run_name: null  # Auto-generated if null
  
  # Advanced settings
  dataloader_config:
    split_batches: false
    dispatch_batches: null

# Ray settings removed - use DDP or Accelerate for multi-GPU training

# Checkpointing and Logging
checkpointing:
  # Checkpoint frequency
  save_every_n_epochs: 1
  save_every_n_steps: null  # Alternative to epochs
  
  # Checkpoint management
  save_top_k: 5  # Keep top K checkpoints
  save_last: true  # Always save last checkpoint
  
  # Checkpoint format
  save_weights_only: false
  save_optimizer_states: true

# Monitoring and Logging
logging:
  # Logging frequency
  log_every_n_steps: 100
  log_every_n_epochs: 1
  
  # Metrics to track
  track_metrics:
    - "train_loss"
    - "val_loss" 
    - "train_per"
    - "val_per"
    - "train_wer"
    - "val_wer"
    - "learning_rate"
    - "gpu_memory_usage"
  
  # Logging backends
  use_tensorboard: true
  use_wandb: false
  
  # Console logging
  log_level: "INFO"
  rich_console: true

# Validation and Evaluation
validation:
  # Validation frequency
  check_val_every_n_epoch: 1
  val_check_interval: 1.0  # Fraction of training epoch
  
  # Early stopping
  enable_early_stopping: true
  patience: 10
  min_delta: 0.001
  monitor: "val_loss"
  mode: "min"

# Performance Optimization
performance:
  # System optimization
  set_float32_matmul_precision: "medium"  # highest, high, medium
  
  # Memory management
  empty_cache_every_n_epochs: 5
  
  # CPU optimization
  torch_num_threads: null  # Auto-detect
  
  # Deterministic training (slower but reproducible)
  deterministic: false
  benchmark: true  # cuDNN benchmark mode

# Hardware Specific Settings
hardware:
  # GPU topology detection
  auto_detect_topology: true
  
  # NVIDIA specific
  enable_nvtx: false  # NVIDIA profiling
  
  # Memory mapping
  use_memory_mapping: false

# Debugging and Profiling
debug:
  # Debug modes
  debug_mode: false
  profile_training: false
  
  # Memory debugging
  detect_anomaly: false  # PyTorch anomaly detection
  
  # Distributed debugging
  log_distributed_info: false
  
  # Profiling settings
  profiler:
    enabled: false
    schedule: "warmup=1;active=3;repeat=2"
    with_stack: false
    with_flops: false
    with_modules: false

# Output Settings
output:
  # Output directory
  output_dir: "outputs/multi_gpu_training"
  
  # Experiment naming
  experiment_name: null  # Auto-generated if null
  version: null  # Auto-incremented if null
  
  # File organization
  create_subdirs: true
  save_config: true
  save_code_snapshot: false

# Environment Settings
environment:
  # Reproducibility
  seed: 42
  deterministic_algorithms: false
  
  # Environment variables (set automatically)
  cuda_visible_devices: null  # Auto-detected
  
  # Process settings
  start_method: "spawn"  # spawn, fork, forkserver
